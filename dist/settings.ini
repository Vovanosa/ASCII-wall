; Open Settings from the tray icon or run asciiwall.exe --settings.
; Randomize and Defaults are previews until you click Save.

[engine]
; Show and animate the wallpaper (1 on, 0 off). The tray app stays available when off. Default: 1.
enabled=1
; Scene script path, relative to the executable directory unless absolute. Default: scenes\campfire.lua.
scene=scenes\campfire.lua
; Windows startup is controlled from the Screen settings and stored in the user's Run key.
; Observe mouse movement over the desktop (1 on, 0 off); clicks are never captured. Default: 1.
mouse_interactions=1
; Render frames per second while plugged in (1-60), not an animation speed. Default: 15.
fps=15
; Render frames per second while on battery (1-60), not an animation speed. Default: 8.
fps_battery=8

[scene]
; Scene scale preset (1 small, 2 medium, 3 large). Defaults uses this profile; Default: 1.
size=1

; Star count multiplier (0-5): 0 disables stars; 1 is default; 2 doubles the count. Default: 1.
stars_density=1.0
; Star twinkle speed multiplier (0-10): 0 stops twinkling. Default: 1.
stars_speed=1.0
; Star color variety (0-1): 0 keeps stars cool-white; 1 adds blue and warm amber stars. Default: 1.
stars_variety=1.00

; Snowflake count multiplier (0-5): 0 disables snow; 1 is default; 2 doubles the count. Default: 1.
snow_density=1.0
; Snow falling speed multiplier (0-10): 0 stops vertical motion. Default: 1.
snow_speed=1.0
; Snowflake side-to-side sway multiplier (0-5): 0 disables sway. Default: 1.
snow_drift=1.0

; Wind in character columns per second (-20 to 20): negative left, positive right, 0 calm. Default: 0.
wind=0.0

; Fire intensity/height (0-3): 0 is lowest; higher values make it taller. Default: 1.
fire_power=1.0
; Fire speed control (0-5), independent of render FPS; 0 freezes; 4 equals the old speed at 1. Default: 1.
fire_speed=1.0
; Fire width multiplier (0.25-3): higher values widen the flame. Default: 1.
fire_width=1.00

; Exact number of trees spread across the full available background on both sides (0-20). Default: 10.
tree_count=10
; Random offset from each evenly spaced tree position, as a fraction of spacing (0-0.45). Default: 0.25.
tree_jitter=0.25
; Smallest random tree size multiplier (0.35-3); 1 is baseline size. Default: 0.75.
tree_min_scale=0.75
; Largest random tree size multiplier (0.35-4); raised to tree_min_scale if smaller. Default: 1.9.
tree_max_scale=1.90
; Snow coverage from the top of each tree (0-1): 0 none, 0.15 current look, 1 fully covered. Default: 0.15.
tree_snow=0.15
; Enable the fixed-color light strings on tree_light_count trees: 1 on, 0 off. Default: 1.
tree_lights=1
; Exact number of evenly selected trees with lights (0-20, capped at tree_count). Default: 4.
tree_light_count=4
; Seconds between light state changes (0.25-30): higher values make lights blink slower. Default: 1.5.
tree_light_interval=1.50

; Coal emission chance per random interval (0-1): 0 disables coals; 1 emits every interval. Default: 0.35.
coal_rate=0.35
; Fire-colored light strength on the snow (0-3): 0 disables ground glow. Default: 1.
glow_power=1.0
; Ground trail lifetime in seconds (1-60); ignored when ground_trace_permanent=1. Default: 10.
ground_trace_seconds=10
; Keep ground trails until the scene reloads (1 on, 0 fade after ground_trace_seconds). Default: 0.
ground_trace_permanent=0
; Mouse gust intensity multiplier (0-3): 0 disables mouse disturbance of the fire. Default: 1.
mouse_fire_power=1.0
; Radius in character cells for snow attracted while holding the mouse button (1-12). Default: 7.
mouse_snow_radius=7
; How quickly held snow follows the pointer (0.1-3). Default: 1.
mouse_snow_pull=1.0
; Maximum number of snowflakes held near the pointer (1-72). Default: 36.
mouse_snow_limit=36
; Snow shower amount when shaking a snowy tree (0-3): 0 disables the shower. Default: 1.
tree_shake_power=1.0
